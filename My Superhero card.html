<!DOCTYPE html>
<html>

<head>
   <title>My Super Hero Power Card</title>
   <style>
      body {

         font-family: Arial;

         background: #f0f4ff;

         padding: 30px;

         text-align: center;

      }

      h1 {
         color: #ff5a43;
      }

      p {
         color: #555;
      }

      .cards {

         display: flex;

         justify-content: center;

         gap: 8px;

         margin-top: 25px;

      }

      .card {

         background: white;

         border: 3px solid #ff5a43;

         border-radius: 12px;

         padding: 20px;

         width: 200px;

      }

      .superhero-name {

         font-size: 22px;

         font-weight: bold;

         color: #333;

      }

      .superhero-fact {
         color: #666;
         margin-top: 10px;
         font-size: 14px;
      }

      button {

         background: #ff5a43;

         color: white;

         border: none;

         padding: 12px 28px;

         border-radius: 8px;

         cursor: pointer;

         font-size: 16px;

         margin-top: 10px;

      }
   </style>
   </head>
<body>
   <h1>My Super Hero Power Card</h1>
   <p>Use a js class to build superhero power cards</p>
   <button onclick="showSuperhero()">Show Superhero</button>
   <div class="cards">
      <div id="card1"></div>
      <div id="card2"></div>
      <div id="card3"></div>
   </div>
   <script>
      class superhero{
         constructor(name,fact){
            this.name=name
            this.fact=fact
         }
         describe(){
            return this.name+ " : "+this.fact
         }
      }
      function showSuperhero(){
         let p1=new superhero("Spider Man","He can throw webs with his wrist")
         let p2=new superhero("Thor","He is called the king of thunder")
         let p3=new superhero("Iron Man","He can fly in the air")

         document.getElementById("card1").innerHTML =

         "<div class='card'><div class='planet-name'>" + p1.name + "</div>" +

         "<div class='planet-fact'>" + p1.describe() + "</div></div>";

         document.getElementById("card2").innerHTML =

         "<div class='card'><div class='planet-name'>" + p2.name + "</div>" +

         "<div class='planet-fact'>" + p2.describe() + "</div></div>";

         document.getElementById("card3").innerHTML =

         "<div class='card'><div class='planet-name'>" + p3.name + "</div>" +

         "<div class='planet-fact'>" + p3.describe() + "</div></div>";

      }
   </script>
</body>
</html>
